    <main>
        <h2>Comunidade</h2>
        <p>Use o formulário para registrar algumas informações sobre sua experiência no jogo.</p>
        <form>
            <fieldset><legend>Formulário</legend>
                <label>Nome: <input type="text" required placeholder="Digite seu nome"></label><br><br>
                <label>E-mail: <input type="email" required placeholder="Digite seu e-mail"></label><br><br>
                <label>Quando começou a jogar: <input type="date"></label><br><br>
                <label>Envie uma imagem: <input type="file"></label><br><br>
                <label>Cor favorita: <input type="color"></label><br><br>
                <label>Nota para o jogo: <input type="range" min="0" max="100"></label><br><br>
                <label>Mob favorito: <input list="mobs"></label>
                <datalist id="mobs"><option value="Creeper"><option value="Zumbi"><option value="Vaca"></datalist><br><br>
                <button type="submit">Enviar</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>Wiki Minecraft - 2026</p>
    </footer>
</body>
